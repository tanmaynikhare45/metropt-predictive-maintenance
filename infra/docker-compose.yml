services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: metropt-db
    env_file: ../.env
    ports:
      - "55432:5432"            # if 5432 is taken on your PC, use "5433:5432" and change DATABASE_URL
    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tsdb_data:
